[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "open-fable"
version = "0.1.0"
description = "A Coven-flavored Recurrent-Depth Transformer for narrative reasoning, character consistency, and long-form story coherence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Coven / OpenFable Contributors" }
]
keywords = ["transformers", "narrative-ai", "recurrent-depth", "language-model", "story-generation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "einops>=0.7",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.3"]
dev   = ["pytest>=7", "pytest-cov", "black", "ruff"]

[project.urls]
"Source"     = "https://github.com/coven-ai/open-fable"
"Bug Tracker" = "https://github.com/coven-ai/open-fable/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_fable*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
